services:
  - type: web
    name: capydocs-backend
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TRUST_PROXY
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_BACKEND
        value: "bm25"
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOADS_PER_HOUR
        value: "10"
      - key: MAX_CHATS_PER_HOUR
        value: "50"
      - key: MAX_SUMMARIES_PER_HOUR
        value: "5"
      - key: MAX_PAGE_COUNT
        value: "50"
      - key: MAX_CONCURRENT_SUMMARIES
        value: "2"
      - key: REQUEST_TIMEOUT
        value: "60"
